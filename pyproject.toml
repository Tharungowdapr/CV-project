[build-system]
requires = ["setuptools>=83.0.0", "wheel"]  # was >=69: 81.0.0 has a MANIFEST.in exclusion-bypass fixed in 83.0.0
build-backend = "setuptools.build_meta"

[project]
name = "reiduq"
version = "0.1.0"
description = "Uncertainty-calibrated vehicle re-identification under occlusion and cross-camera domain shift"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
  # torch >=2.13.0 is required for three stacked reasons: Blackwell GPU (RTX
  # 50-series, compute capability 12.x) support needs a build newer than 2.5;
  # 2.10.0 fixes a torch.load(weights_only=True) pickle RCE (PYSEC-2026-2286)
  # that docs/threat_model.md explicitly relies on weights_only=True to
  # defend against; and 2.11.0 has a separate critical torch.jit.script
  # memory-corruption CVE (PYSEC-2025-194) fixed only in 2.13.0. Install the
  # CUDA build explicitly for your hardware, e.g.:
  #   pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cu126
  # then `pip install -e .` will see the requirement already satisfied.
  "torch>=2.13.0,<2.15.0",
  "torchvision>=0.28.0,<0.30.0",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "opencv-python-headless==4.10.0.84",  # headless: no GUI libs in container
  "pillow>=12.3.0",             # was 10.3.0: that version has multiple unpatched heap-corruption/RCE-class CVEs (pip-audit, 2026)
  "faiss-cpu==1.8.0",           # swap for faiss-gpu on a CUDA host
  "ultralytics==8.2.48",        # YOLOv8 detection + segmentation
  "pydantic==2.7.4",            # config + API validation
  "pydantic-settings==2.3.4",
  "pyyaml==6.0.1",
  "typer==0.12.3",              # CLI
  "rich==13.7.1",
  "structlog==24.2.0",          # structured JSON logging
  "matplotlib==3.9.0",
  "pandas==2.2.2",
  "scikit-learn==1.5.0",        # Platt scaling, metrics cross-checks
  "tqdm==4.66.4",
  "fastapi>=0.115.6",           # was 0.111.0: pulls starlette>=1.3.1 (see explicit pin below) fixing host-header/SSRF/DoS issues
  "starlette>=1.3.1",           # explicit floor, not left to fastapi's transitive resolution: fixes Host-header URL-reconstruction spoofing, Windows UNC/SMB SSRF in StaticFiles, and a urlencoded-form DoS
  "uvicorn[standard]==0.30.1",
  "python-multipart>=0.0.31",   # was 0.0.9: fixes a path-traversal write (UPLOAD_KEEP_FILENAME) and several parsing-DoS issues
  "slowapi==0.1.9",             # rate limiting
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2", "pytest-cov==5.0.0", "pytest-asyncio==0.23.7",
  "hypothesis==6.103.1", "httpx==0.27.0",
  "ruff==0.4.9", "black==24.4.2", "mypy==1.10.0",
  "import-linter==2.0", "bandit==1.7.9", "pip-audit==2.7.3",
  "pre-commit==3.7.1", "types-PyYAML", "types-tqdm",
]
track = ["mlflow==2.14.1", "dvc==3.51.2"]
sam  = ["segment-anything-py==1.0"]
gpu-monitor = ["pynvml==11.5.3"]  # optional: GPU temperature polling in the trainer's thermal guard
plate-ocr = ["easyocr>=1.7.2"]    # optional: best-effort plate reading in search/plate_ocr.py; absent = plate search still runs, just finds nothing

[project.scripts]
reiduq = "reiduq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E","F","I","B","UP","S","C4","SIM","ARG","PTH","RUF"]
ignore = ["S101"]           # assert is allowed in tests
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_generics = true
ignore_missing_imports = true      # third-party CV libs ship no stubs
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=src/reiduq --cov-report=term-missing --cov-report=xml"
markers = [
  "slow: requires GPU or full dataset",
  "integration: multi-stage test",
  "security: boundary and abuse tests",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]

[tool.importlinter]
root_package = "reiduq"
[[tool.importlinter.contracts]]
name = "Layered architecture: inner layers never import outer ones"
type = "layers"
layers = ["reiduq.serving", "reiduq.experiments", "reiduq.pipeline", "reiduq.eval", "reiduq.calibration", "reiduq.data", "reiduq.core"]
