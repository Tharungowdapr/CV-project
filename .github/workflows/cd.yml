name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write        # keyless signing via OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the built image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          format: spdx-json

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes ghcr.io/${{ github.repository }}/api@${{ steps.build.outputs.digest }}

      - name: Deploy to staging
        run: bash scripts/deploy.sh staging
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}

  promote:
    needs: release
    runs-on: ubuntu-latest
    environment: production        # requires a manual approval in GitHub
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy.sh production
