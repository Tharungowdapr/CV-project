name: reiduq

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports: ["8000:8000"]
    env_file: ../.env
    environment:
      APP_ENV: development
      MODEL_REGISTRY_PATH: /app/models
    volumes:
      - ../models:/app/models:ro          # checkpoints are read-only to the service
      - ../outputs:/app/outputs
    read_only: true                        # writable paths are declared explicitly
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db
    ports: ["5000:5000"]
    volumes: ["../mlflow:/mlflow"]
